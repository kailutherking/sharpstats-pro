name: Release

# Push a tag such as v1.2.0 (matching package.json) to publish a GitHub release
# with that version's CHANGELOG.md section and versioned images.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches package.json
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then echo "Tag v$tag does not match package.json $pkg" && exit 1; fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Extract changelog section
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}" && exit 1; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "SharpStats Pro $GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        run: echo "repo=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Push versioned backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.names.outputs.repo }}-backend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=backend
      - name: Push versioned frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: ${{ steps.names.outputs.repo }}-frontend:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=frontend
