name: CI

on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sharpstats
          POSTGRES_USER: sharpstats
          POSTGRES_PASSWORD: sharpstats
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sharpstats -d sharpstats"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sharpstats:sharpstats@localhost:5432/sharpstats
      JWT_SECRET: ci-only-secret-that-is-long-enough-123456789
      CLIENT_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Generate Prisma client
        run: npm run prisma:generate --workspace backend
      - name: Apply database schema
        run: |
          PGPASSWORD=sharpstats psql -h localhost -U sharpstats -d sharpstats -v ON_ERROR_STOP=1 -f backend/src/db/schema.sql
          PGPASSWORD=sharpstats psql -h localhost -U sharpstats -d sharpstats -v ON_ERROR_STOP=1 -f backend/src/db/seed.sql
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build backend
        run: npm run build --workspace backend
      - name: Build frontend
        run: npm run build --workspace frontend
      - name: Dependency audit
        run: npm audit --audit-level=high

  production-readiness:
    name: Production images
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Check schema and secrets hygiene
        run: |
          test -f .env.example
          if git ls-files | grep -E '(^|/)\.env$'; then echo "A .env file is committed" && exit 1; fi
          grep -q "CREATE TABLE IF NOT EXISTS" backend/src/db/schema.sql
