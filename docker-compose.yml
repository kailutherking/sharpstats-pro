services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sharpstats
      POSTGRES_USER: sharpstats
      POSTGRES_PASSWORD: sharpstats
    ports:
      - "5432:5432"
    volumes:
      - sharpstats-data:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharpstats -d sharpstats"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://sharpstats:sharpstats@db:5432/sharpstats
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-long-random-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      DEMO_EMAIL: demo@sharpstats.pro
      DEMO_PASSWORD: SharpStats123!
      ODDS_API_KEY: ${ODDS_API_KEY:-}
      ODDS_REFRESH_SECONDS: ${ODDS_REFRESH_SECONDS:-30}
      ODDS_BACKGROUND_REFRESH_MINUTES: ${ODDS_BACKGROUND_REFRESH_MINUTES:-30}
      ODDS_SHARP_BOOK: ${ODDS_SHARP_BOOK:-pinnacle}
      ODDS_MIN_CREDITS: ${ODDS_MIN_CREDITS:-250}
      ODDS_EXTRA_BOOKS: ${ODDS_EXTRA_BOOKS:-}
      STATS_REFRESH_MINUTES: ${STATS_REFRESH_MINUTES:-15}
      SPORTRADAR_API_KEY: ${SPORTRADAR_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "5173:80"
    depends_on:
      - backend
volumes:
  sharpstats-data:
